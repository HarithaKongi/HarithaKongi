name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest streak stats
        run: |
          mkdir -p profile
          curl --fail --location --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 60 \
            "https://streak-stats.demolab.com/?user=HarithaKongi&theme=tokyonight&hide_border=true&timezone=Asia%2FKolkata" \
            --output profile/streak.svg
          test -s profile/streak.svg
          grep -q "<svg" profile/streak.svg

      - name: Commit updated streak image
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GitHub streak stats"
          file_pattern: profile/streak.svg
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
